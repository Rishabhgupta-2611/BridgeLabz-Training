<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Edit Greeting</title>

</head>

<body>

<h1>Edit Greeting</h1>


<form th:action="@{/greetings/update}"
      th:object="${greeting}"
      method="post">

    <input type="hidden"
           th:field="*{id}">


    <label>Message:</label>

    <input type="text"
           th:field="*{message}"
           required>


    <br>
    <br>


    <button type="submit">
        Update Greeting
    </button>

</form>


<br>

<a href="/greetings">
    Back to Greetings
</a>

</body>

</html>
